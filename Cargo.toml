[package]
name = "simple-tls"
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Simple and easy-to-use TCP connection forwarder with TLS 1.3 and gRPC transports"
repository = "https://github.com/MrKsey/simple-tls"
build = "build.rs"

[[bin]]
name = "simple-tls"
path = "src/main.rs"

[lib]
name = "simple_tls"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
bytes = "1"
env_logger = "0.11"
h2 = "0.4"
hex = "0.4"
http = "1"
log = "0.4"
portable-atomic = "1"
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
webpki-roots = "1"
x509-parser = "0.18"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
